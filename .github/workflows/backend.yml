name: Backend CI/CD

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B clean verify

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/employee-be
            git pull origin main
            docker build -t employee-be .
            docker rm -f employee-api || true
            docker run -d -p 8080:8081 \
              -v /home/ubuntu/employee-data:/app/data \
              --restart unless-stopped \
              --name employee-api employee-be
            docker image prune -f
